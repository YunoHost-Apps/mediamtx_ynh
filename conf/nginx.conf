#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_redirect / __PATH__/;
    # https://mediamtx.org/docs/features/expose-the-server-in-a-subfolder

    include proxy_params_no_auth;
    proxy_set_header X-Remote-User $remote_user;
    proxy_set_header Authorization "Bearer YunoHost";
}

location __PATH__/webrtc/ {
    proxy_pass http://127.0.0.1:__PORT_WEBRTC__/;
    proxy_redirect / __PATH__/webrtc/;

    include proxy_params_no_auth;
    proxy_set_header X-Remote-User $remote_user;
    proxy_set_header Authorization "Bearer YunoHost";
}

location __PATH__/playback/ {
    proxy_pass http://127.0.0.1:__PORT_PLAYBACK__/;
    proxy_redirect / __PATH__/playback/;

    include proxy_params_no_auth;
    proxy_set_header X-Remote-User $remote_user;
    proxy_set_header Authorization "Bearer YunoHost";
}
