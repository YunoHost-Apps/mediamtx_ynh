#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mediamtx"
name = "MediaMTX"
description.en = "Media router that routes media streams from one end to the other"
description.fr = "Routeur multimédia qui transfère des flux d'un point à un autre"

version = "1.21.4~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "MIT"
website = "https://mediamtx.org/"
admindoc = "https://mediamtx.org/docs/kickoff/introduction"
code = "https://github.com/bluenviron/mediamtx"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "500M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]
    [resources.sources.main]
    amd64.url = "https://github.com/bluenviron/mediamtx/releases/download/v1.21.4/mediamtx_v1.21.4_linux_amd64.tar.gz"
    amd64.sha256 = "be0c05d9c8af8338116977e7f1c3fcb409fbf882075e5ab075cf8baad76a59d2"
    arm64.url = "https://github.com/bluenviron/mediamtx/releases/download/v1.21.4/mediamtx_v1.21.4_linux_arm64.tar.gz"
    arm64.sha256 = "47784081da54c0608ea4dc359f5cfb19880209434769c532b3ed3a67ea99c29d"
    armhf.url = "https://github.com/bluenviron/mediamtx/releases/download/v1.21.4/mediamtx_v1.21.4_linux_armv7.tar.gz"
    armhf.sha256 = "48a067993e28e409478463dc71d2ee8a82511acebc4956f685ecfeda2b0bd9ae"
    in_subdir = false

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*\\_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = ".*\\_linux_arm64.tar.gz"
    autoupdate.asset.armhf = ".*\\_linux_armv7.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8888  # HLS port

    rtsp.default = 8554
    rtsp.exposed = "TCP"
    rtsps.default = 8322
    rtsps.exposed = "TCP"
    rtp.default = 8000
    rtp.exposed = "UDP"
    rtcp.default = 8001
    rtcp.exposed = "UDP"

    rtmp.default = 1935
    rtmp.exposed = "TCP"
    rtmps.default = 1936
    rtmps.exposed = "TCP"

    webrtc.default = 8889
    webrtc.exposed = "TCP"
    webrtc_udp.default = 8189
    webrtc_udp.exposed = "UDP"

    srt.default = 8890
    srt.exposed = "UDP"

    playback.default = 9996
    playback.exposed = "UDP"

    api.default = 9997
    metrics.default = 9998
    pprof.default = 9998

    [resources.apt]
    packages = ["ffmpeg"]
