#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "mediamtx"
name = "MediaMTX"
description.en = "Media router that routes media streams from one end to the other"
description.fr = "Routeur média qui transfère les flux d'un point à un autre"

version = "1.21.3~ynh1"

maintainers = [ "OniriCorpe" ]

[upstream]
license = "MIT"
website = "https://mediamtx.org/"
admindoc = "https://mediamtx.org/docs/references/configuration-file"
code = "https://github.com/bluenviron/mediamtx"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"

# FIXME: replace with an **estimate** minimum disk and RAM requirements. e.g. 20M, 400M, 1G...
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/example"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]
    [resources.sources.main]
    amd64.url = "https://github.com/bluenviron/mediamtx/releases/download/v1.21.3/mediamtx_v1.21.3_linux_amd64.tar.gz"
    amd64.sha256 = "0a2ea7eba96023631efa1bea7804823a9145b043b6646a8a05798d4ac24ed635"
    arm64.url = "https://github.com/bluenviron/mediamtx/releases/download/v1.21.3/mediamtx_v1.21.3_linux_arm64.tar.gz"
    arm64.sha256 = "27f038237cb5f77a724f6afc58eca2798f2bc4edf9989895631a80eeb41a4fe2"
    armhf.url = "https://github.com/bluenviron/mediamtx/releases/download/v1.21.3/mediamtx_v1.21.3_linux_armv7.tar.gz"
    armhf.sha256 = "134b53bfdb26583d02e1c27fc256d587cf3482e80c9e3b49083595e19a096284"
    in_subdir = false

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*\\_linux_amd64.tar.gz"
    autoupdate.asset.arm64 = ".*\\_linux_arm64.tar.gz"
    autoupdate.asset.armhf = ".*\\_linux_armv7.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 8888  # HLS port

    rtsp.default = 8554
    rtsp.exposed = "TCP"
    rtsps.default = 8322
    rtsps.exposed = "TCP"
    rtp.default = 8000
    rtp.exposed = "UDP"
    rtcp.default = 8001
    rtcp.exposed = "UDP"

    rtmp.default = 1935
    rtmp.exposed = "TCP"
    rtmps.default = 1936
    rtmps.exposed = "TCP"

    webrtc.default = 8889
    webrtc.exposed = "TCP"
    webrtc_udp.default = 8189
    webrtc_udp.exposed = "UDP"

    srt.default = 8890
    srt.exposed = "UDP"

    playback.default = 9996
    playback.exposed = "UDP"

    api.default = 9997
    api.exposed = "TCP"

    metrics.default = 9998
    metrics.exposed = "TCP"

    pprof.default = 9998
    pprof.exposed = "TCP"
